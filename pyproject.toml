[project]
name = "playground-agent"
version = "0.1.0"
description = "PlaygroundAgent — a reference LangGraph + FastAPI + PostgreSQL agent for testing and demonstration"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["S101", "S307"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
